version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: optiflow-postgres-prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-optiflow}
      POSTGRES_USER: ${POSTGRES_USER:-optiflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "-E UTF8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - optiflow-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-optiflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # InfluxDB Time Series Database
  influxdb:
    image: influxdb:2.7-alpine
    container_name: optiflow-influxdb-prod
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_ADMIN_USER}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_ADMIN_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG:-optiflow}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET:-timeseries}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN}
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    ports:
      - "8086:8086"
    networks:
      - optiflow-network
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis Cache & Pub/Sub
  redis:
    image: redis:7-alpine
    container_name: optiflow-redis-prod
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - optiflow-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: optiflow-rabbitmq-prod
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-optiflow}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: /
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - optiflow-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: optiflow-backend-prod
    volumes:
      - backend_mlflow:/app/mlruns
      - backend_logs:/app/logs
    ports:
      - "8000:8000"
    environment:
      # Application
      APP_NAME: "OptiFlow AI Platform"
      ENVIRONMENT: production
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY}
      LOG_LEVEL: INFO

      # Database - PostgreSQL
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-optiflow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-optiflow}

      # Database - InfluxDB
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN}
      INFLUXDB_ORG: ${INFLUXDB_ORG:-optiflow}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET:-timeseries}

      # Database - Redis
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0

      # Message Queue
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-optiflow}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-optiflow}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/4

      # Security
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: 15

      # CORS
      CORS_ORIGINS: ${CORS_ORIGINS}

      # Gateway
      GATEWAY_API_KEY: ${GATEWAY_API_KEY}
    networks:
      - optiflow-network
    depends_on:
      postgres:
        condition: service_healthy
      influxdb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # Celery Worker
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: optiflow-celery-worker-prod
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=4
    volumes:
      - backend_mlflow:/app/mlruns
      - backend_logs:/app/logs
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-optiflow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-optiflow}
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN}
      INFLUXDB_ORG: ${INFLUXDB_ORG:-optiflow}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET:-timeseries}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-optiflow}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-optiflow}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/4
    networks:
      - optiflow-network
    depends_on:
      - postgres
      - redis
      - rabbitmq
      - backend
    restart: unless-stopped

  # Celery Beat (Scheduler)
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: optiflow-celery-beat-prod
    command: celery -A app.tasks.celery_app beat --loglevel=info
    volumes:
      - backend_logs:/app/logs
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-optiflow}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-optiflow}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/4
    networks:
      - optiflow-network
    depends_on:
      - rabbitmq
      - redis
      - backend
    restart: unless-stopped

  # Frontend Web Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: optiflow-frontend-prod
    ports:
      - "80:80"
      - "443:443"
    environment:
      VITE_API_URL: ${VITE_API_URL}
      VITE_WS_URL: ${VITE_WS_URL}
    networks:
      - optiflow-network
    depends_on:
      - backend
    restart: unless-stopped

  # MLflow (Model Tracking & Registry)
  mlflow:
    image: python:3.11-slim
    container_name: optiflow-mlflow-prod
    command: >
      sh -c "pip install mlflow psycopg2-binary &&
             mlflow server
             --backend-store-uri postgresql://${POSTGRES_USER:-optiflow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-optiflow}
             --default-artifact-root /mlflow/artifacts
             --host 0.0.0.0
             --port 5000"
    volumes:
      - backend_mlflow:/mlflow
    ports:
      - "5000:5000"
    networks:
      - optiflow-network
    depends_on:
      - postgres
    restart: unless-stopped

  # Prometheus (Metrics)
  prometheus:
    image: prom/prometheus:latest
    container_name: optiflow-prometheus-prod
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - optiflow-network
    restart: unless-stopped

  # Grafana (Dashboards)
  grafana:
    image: grafana/grafana:latest
    container_name: optiflow-grafana-prod
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_INSTALL_PLUGINS: grafana-clock-panel
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - optiflow-network
    depends_on:
      - prometheus
      - influxdb
    restart: unless-stopped

networks:
  optiflow-network:
    driver: bridge

volumes:
  postgres_data:
  influxdb_data:
  influxdb_config:
  redis_data:
  rabbitmq_data:
  backend_mlflow:
  backend_logs:
  prometheus_data:
  grafana_data:

version: '3.8'

# Production Docker Compose Configuration
# Uses environment variables from .env.prod file

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: smartport-postgres-prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "-E UTF8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups/postgres:/backups
    networks:
      - smartport-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Production: Don't expose port publicly
    # ports:
    #   - "5432:5432"

  # InfluxDB Time Series Database
  influxdb:
    image: influxdb:2.7-alpine
    container_name: smartport-influxdb-prod
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_USER}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN}
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
      - ./backups/influxdb:/backups
    networks:
      - smartport-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Production: Don't expose port publicly
    # ports:
    #   - "8086:8086"

  # Redis Cache & Pub/Sub
  redis:
    image: redis:7-alpine
    container_name: smartport-redis-prod
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - smartport-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    # Production: Don't expose port publicly
    # ports:
    #   - "6379:6379"

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: smartport-backend-prod
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4 --no-access-log
    volumes:
      - backend_logs:/app/logs
    environment:
      # Application
      APP_NAME: "SmartPort Production"
      ENVIRONMENT: production
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY}

      # Database - PostgreSQL
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

      # Database - InfluxDB
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: ${INFLUX_TOKEN}
      INFLUXDB_ORG: ${INFLUX_ORG}
      INFLUXDB_BUCKET: ${INFLUX_BUCKET}

      # Database - Redis
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0

      # Security
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: 30

      # CORS
      CORS_ORIGINS: ${CORS_ORIGINS}

      # Gateway
      GATEWAY_API_KEY: ${GATEWAY_API_KEY}
    networks:
      - smartport-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      influxdb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Production: Don't expose directly, use nginx
    # ports:
    #   - "8000:8000"

  # Gateway (Data Collection)
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile.prod
    container_name: smartport-gateway-prod
    volumes:
      - gateway_logs:/app/logs
      - gateway_data:/app/data
    environment:
      API_URL: http://backend:8000
      API_KEY: ${GATEWAY_API_KEY}
      LOG_LEVEL: INFO

      # InfluxDB
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: ${INFLUX_TOKEN}
      INFLUXDB_ORG: ${INFLUX_ORG}
      INFLUXDB_BUCKET: ${INFLUX_BUCKET}

      # Redis
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    networks:
      - smartport-network
    restart: unless-stopped
    depends_on:
      - backend
      - influxdb
      - redis
    # For direct device communication, use host network:
    # network_mode: host

  # Frontend Web Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: smartport-frontend-prod
    networks:
      - smartport-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
    # Production: Don't expose directly, use nginx
    # ports:
    #   - "80:80"

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: smartport-nginx-prod
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    ports:
      - "80:80"
      - "443:443"
    networks:
      - smartport-network
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Automated Backup Service
  backup:
    image: postgres:15-alpine
    container_name: smartport-backup-prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGHOST: postgres
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
      BACKUP_ENABLED: ${BACKUP_ENABLED:-true}
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUX_ORG: ${INFLUX_ORG}
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    networks:
      - smartport-network
    restart: "no"
    depends_on:
      - postgres
      - influxdb
    # Run backup via cron or manually
    entrypoint: /bin/sh
    command: -c "chmod +x /backup.sh && crond -f"

networks:
  smartport-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  postgres_data:
    driver: local
  influxdb_data:
    driver: local
  influxdb_config:
    driver: local
  redis_data:
    driver: local
  backend_logs:
    driver: local
  gateway_logs:
    driver: local
  gateway_data:
    driver: local
  nginx_logs:
    driver: local

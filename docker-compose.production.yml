# OptiFlow AI - Production-Ready High Availability Architecture
# Kafka Cluster (3 brokers) + Zookeeper Ensemble (3 nodes) + InfluxDB Cluster (3 nodes)

version: '3.8'

services:
  # ========================================
  # ZOOKEEPER ENSEMBLE (3 nodes for quorum)
  # ========================================

  zookeeper-1:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: optiflow-zookeeper-1
    hostname: zookeeper-1
    environment:
      ZOOKEEPER_SERVER_ID: 1
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_SERVERS: zookeeper-1:2888:3888;zookeeper-2:2888:3888;zookeeper-3:2888:3888
    volumes:
      - zookeeper_1_data:/var/lib/zookeeper/data
      - zookeeper_1_logs:/var/lib/zookeeper/log
    ports:
      - "2181:2181"
    networks:
      - optiflow-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  zookeeper-2:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: optiflow-zookeeper-2
    hostname: zookeeper-2
    environment:
      ZOOKEEPER_SERVER_ID: 2
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_SERVERS: zookeeper-1:2888:3888;zookeeper-2:2888:3888;zookeeper-3:2888:3888
    volumes:
      - zookeeper_2_data:/var/lib/zookeeper/data
      - zookeeper_2_logs:/var/lib/zookeeper/log
    ports:
      - "2182:2181"
    networks:
      - optiflow-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  zookeeper-3:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: optiflow-zookeeper-3
    hostname: zookeeper-3
    environment:
      ZOOKEEPER_SERVER_ID: 3
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_SERVERS: zookeeper-1:2888:3888;zookeeper-2:2888:3888;zookeeper-3:2888:3888
    volumes:
      - zookeeper_3_data:/var/lib/zookeeper/data
      - zookeeper_3_logs:/var/lib/zookeeper/log
    ports:
      - "2183:2181"
    networks:
      - optiflow-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ========================================
  # KAFKA CLUSTER (3 brokers)
  # ========================================

  kafka-1:
    image: confluentinc/cp-kafka:7.5.0
    container_name: optiflow-kafka-1
    hostname: kafka-1
    depends_on:
      zookeeper-1:
        condition: service_healthy
      zookeeper-2:
        condition: service_healthy
      zookeeper-3:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "19092:19092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # REPLICATION & DURABILITY (CRITICAL)
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3

      # PERFORMANCE
      KAFKA_NUM_PARTITIONS: 12
      KAFKA_COMPRESSION_TYPE: lz4
      KAFKA_LOG_SEGMENT_BYTES: 536870912  # 512MB
      KAFKA_LOG_RETENTION_HOURS: 168  # 7 days

      # AUTO-CREATE TOPICS
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

      # JVM HEAP (adjust based on your RAM)
      KAFKA_HEAP_OPTS: "-Xms2G -Xmx2G"
    volumes:
      - kafka_1_data:/var/lib/kafka/data
    networks:
      - optiflow-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  kafka-2:
    image: confluentinc/cp-kafka:7.5.0
    container_name: optiflow-kafka-2
    hostname: kafka-2
    depends_on:
      zookeeper-1:
        condition: service_healthy
      zookeeper-2:
        condition: service_healthy
      zookeeper-3:
        condition: service_healthy
    ports:
      - "9093:9092"
      - "19093:19093"
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092,EXTERNAL://localhost:19093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3

      KAFKA_NUM_PARTITIONS: 12
      KAFKA_COMPRESSION_TYPE: lz4
      KAFKA_LOG_SEGMENT_BYTES: 536870912
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xms2G -Xmx2G"
    volumes:
      - kafka_2_data:/var/lib/kafka/data
    networks:
      - optiflow-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  kafka-3:
    image: confluentinc/cp-kafka:7.5.0
    container_name: optiflow-kafka-3
    hostname: kafka-3
    depends_on:
      zookeeper-1:
        condition: service_healthy
      zookeeper-2:
        condition: service_healthy
      zookeeper-3:
        condition: service_healthy
    ports:
      - "9094:9092"
      - "19094:19094"
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092,EXTERNAL://localhost:19094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3

      KAFKA_NUM_PARTITIONS: 12
      KAFKA_COMPRESSION_TYPE: lz4
      KAFKA_LOG_SEGMENT_BYTES: 536870912
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xms2G -Xmx2G"
    volumes:
      - kafka_3_data:/var/lib/kafka/data
    networks:
      - optiflow-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # Kafka UI - Monitoring
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: optiflow-kafka-ui
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: optiflow-production
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181
      DYNAMIC_CONFIG_ENABLED: 'true'
    networks:
      - optiflow-network
    restart: unless-stopped

  # ========================================
  # INFLUXDB CLUSTER (3 nodes)
  # ========================================

  influxdb-1:
    image: influxdb:2.7-alpine
    container_name: optiflow-influxdb-1
    hostname: influxdb-1
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: adminpassword
      DOCKER_INFLUXDB_INIT_ORG: optiflow
      DOCKER_INFLUXDB_INIT_BUCKET: timeseries
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: my-super-secret-influxdb-token
    volumes:
      - influxdb_1_data:/var/lib/influxdb2
      - influxdb_1_config:/etc/influxdb2
    ports:
      - "8086:8086"
    networks:
      - optiflow-network
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  influxdb-2:
    image: influxdb:2.7-alpine
    container_name: optiflow-influxdb-2
    hostname: influxdb-2
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: adminpassword
      DOCKER_INFLUXDB_INIT_ORG: optiflow
      DOCKER_INFLUXDB_INIT_BUCKET: timeseries
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: my-super-secret-influxdb-token
    volumes:
      - influxdb_2_data:/var/lib/influxdb2
      - influxdb_2_config:/etc/influxdb2
    ports:
      - "8087:8086"
    networks:
      - optiflow-network
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  influxdb-3:
    image: influxdb:2.7-alpine
    container_name: optiflow-influxdb-3
    hostname: influxdb-3
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: adminpassword
      DOCKER_INFLUXDB_INIT_ORG: optiflow
      DOCKER_INFLUXDB_INIT_BUCKET: timeseries
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: my-super-secret-influxdb-token
    volumes:
      - influxdb_3_data:/var/lib/influxdb2
      - influxdb_3_config:/etc/influxdb2
    ports:
      - "8088:8086"
    networks:
      - optiflow-network
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ========================================
  # DATABASES (kept from original)
  # ========================================

  postgres:
    image: postgres:15-alpine
    container_name: optiflow-postgres
    environment:
      POSTGRES_DB: optiflow
      POSTGRES_USER: optiflow
      POSTGRES_PASSWORD: optiflow_password
      POSTGRES_INITDB_ARGS: "-E UTF8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - optiflow-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U optiflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: optiflow-redis
    command: redis-server --appendonly yes --requirepass optiflow_redis_password --maxmemory 4gb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - optiflow-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: optiflow-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: optiflow
      RABBITMQ_DEFAULT_PASS: optiflow_password
      RABBITMQ_DEFAULT_VHOST: /
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - optiflow-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ========================================
  # BACKEND API (3 replicas for HA)
  # ========================================

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    deploy:
      replicas: 3
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    volumes:
      - ./backend:/app
      - backend_mlflow:/app/mlruns
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "8000-8002:8000"
    environment:
      APP_NAME: "OptiFlow AI Platform"
      ENVIRONMENT: production
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}

      # Database - PostgreSQL
      DATABASE_URL: postgresql+asyncpg://optiflow:optiflow_password@postgres:5432/optiflow

      # Database - InfluxDB (Load balanced across 3 nodes)
      INFLUXDB_URLS: http://influxdb-1:8086,http://influxdb-2:8086,http://influxdb-3:8086
      INFLUXDB_URL: http://influxdb-1:8086
      INFLUXDB_TOKEN: my-super-secret-influxdb-token
      INFLUXDB_ORG: optiflow
      INFLUXDB_BUCKET: timeseries

      # Database - Redis
      REDIS_URL: redis://:optiflow_redis_password@redis:6379/0

      # Message Queue
      RABBITMQ_URL: amqp://optiflow:optiflow_password@rabbitmq:5672/
      CELERY_BROKER_URL: amqp://optiflow:optiflow_password@rabbitmq:5672/
      CELERY_RESULT_BACKEND: redis://:optiflow_redis_password@redis:6379/4

      # Kafka Cluster (3 brokers)
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      KAFKA_PRODUCER_ACKS: all
      KAFKA_PRODUCER_RETRIES: 10
      KAFKA_PRODUCER_ENABLE_IDEMPOTENCE: "true"
      KAFKA_CONSUMER_GROUP_ID: timeseries-writers
      KAFKA_CONSUMER_AUTO_OFFSET_RESET: earliest

      # Security
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-jwt-secret-key-change-in-production}
      ACCESS_TOKEN_EXPIRE_MINUTES: 15

      # CORS
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:3000","http://localhost:3002"]'

      # Gateway
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:-secure-gateway-api-key-change-in-production}

      # AI Agent - Ollama
      OLLAMA_BASE_URL: http://ollama:11434

    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - optiflow-network
    depends_on:
      postgres:
        condition: service_healthy
      influxdb-1:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    restart: unless-stopped

  # ========================================
  # OTHER SERVICES (kept from original)
  # ========================================

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: optiflow-celery-worker
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=8
    volumes:
      - ./backend:/app
      - backend_mlflow:/app/mlruns
    environment:
      DATABASE_URL: postgresql+asyncpg://optiflow:optiflow_password@postgres:5432/optiflow
      INFLUXDB_URL: http://influxdb-1:8086
      INFLUXDB_TOKEN: my-super-secret-influxdb-token
      INFLUXDB_ORG: optiflow
      INFLUXDB_BUCKET: timeseries
      REDIS_URL: redis://:optiflow_redis_password@redis:6379/0
      RABBITMQ_URL: amqp://optiflow:optiflow_password@rabbitmq:5672/
      CELERY_BROKER_URL: amqp://optiflow:optiflow_password@rabbitmq:5672/
      CELERY_RESULT_BACKEND: redis://:optiflow_redis_password@redis:6379/4
    networks:
      - optiflow-network
    depends_on:
      - postgres
      - redis
      - rabbitmq
      - backend
    restart: unless-stopped

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: optiflow-celery-beat
    command: celery -A app.tasks.celery_app beat --loglevel=info
    volumes:
      - ./backend:/app
    environment:
      RABBITMQ_URL: amqp://optiflow:optiflow_password@rabbitmq:5672/
      CELERY_BROKER_URL: amqp://optiflow:optiflow_password@rabbitmq:5672/
      CELERY_RESULT_BACKEND: redis://:optiflow_redis_password@redis:6379/4
    networks:
      - optiflow-network
    depends_on:
      - rabbitmq
      - redis
      - backend
    restart: unless-stopped

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: optiflow-gateway
    command: python -m app
    volumes:
      - ./gateway:/app
      - ./gateway/config:/app/config
      - gateway_data:/app/data
    environment:
      API_URL: http://backend:8000
      API_KEY: ${GATEWAY_API_KEY:-secure-gateway-api-key-change-in-production}
      LOG_LEVEL: INFO
      REDIS_URL: redis://:optiflow_redis_password@redis:6379/1
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
    networks:
      - optiflow-network
    depends_on:
      - backend
      - redis
      - kafka-1
    restart: unless-stopped

  opcua-server:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: optiflow-opcua-server
    command: python scripts/run_opcua_server.py --endpoint opc.tcp://0.0.0.0:4840/optiflow/terminal
    working_dir: /app
    volumes:
      - ./backend:/app
    ports:
      - "4840:4840"
    environment:
      PYTHONUNBUFFERED: 1
      LOG_LEVEL: INFO
    networks:
      - optiflow-network
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import socket; s = socket.socket(); s.connect((\"localhost\", 4840)); s.close()'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: builder
    container_name: optiflow-frontend
    command: npm run dev -- --host --port 3000
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_WS_URL: ws://localhost:8000
    networks:
      - optiflow-network
    depends_on:
      - backend
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: optiflow-ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11435:11434"
    networks:
      - optiflow-network
    environment:
      - OLLAMA_HOST=0.0.0.0
    restart: unless-stopped

  mlflow:
    image: python:3.11-slim
    container_name: optiflow-mlflow
    command: >
      sh -c "pip install -q mlflow psycopg2-binary &&
             mlflow server
             --backend-store-uri postgresql://optiflow:optiflow_password@postgres:5432/optiflow
             --default-artifact-root /mlflow/artifacts
             --host 0.0.0.0
             --port 5000"
    volumes:
      - backend_mlflow:/mlflow
    ports:
      - "5000:5000"
    networks:
      - optiflow-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:5000/health\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ========================================
  # MONITORING (Prometheus + Grafana + AlertManager)
  # ========================================

  prometheus:
    image: prom/prometheus:latest
    container_name: optiflow-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/prometheus/alerts:/etc/prometheus/alerts
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - optiflow-network
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:latest
    container_name: optiflow-alertmanager
    command:
      - '--config.file=/etc/alertmanager/config.yml'
      - '--storage.path=/alertmanager'
    volumes:
      - ./monitoring/alertmanager:/etc/alertmanager
      - alertmanager_data:/alertmanager
    ports:
      - "9093:9093"
    networks:
      - optiflow-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: optiflow-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: grafana-clock-panel
    volumes:
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    networks:
      - optiflow-network
    restart: unless-stopped

  # Exporters (kept from original)
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: optiflow-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://optiflow:optiflow_password@postgres:5432/optiflow?sslmode=disable"
    ports:
      - "9187:9187"
    networks:
      - optiflow-network
    depends_on:
      - postgres
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: optiflow-redis-exporter
    environment:
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: "optiflow_redis_password"
    ports:
      - "9121:9121"
    networks:
      - optiflow-network
    depends_on:
      - redis
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    container_name: optiflow-node-exporter
    command:
      - '--path.rootfs=/host'
    pid: host
    volumes:
      - /:/host:ro,rslave
    ports:
      - "9100:9100"
    networks:
      - optiflow-network
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: optiflow-cadvisor
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8081:8080"
    networks:
      - optiflow-network
    restart: unless-stopped

networks:
  optiflow-network:
    driver: bridge

volumes:
  # Zookeeper
  zookeeper_1_data:
  zookeeper_1_logs:
  zookeeper_2_data:
  zookeeper_2_logs:
  zookeeper_3_data:
  zookeeper_3_logs:

  # Kafka
  kafka_1_data:
  kafka_2_data:
  kafka_3_data:

  # InfluxDB
  influxdb_1_data:
  influxdb_1_config:
  influxdb_2_data:
  influxdb_2_config:
  influxdb_3_data:
  influxdb_3_config:

  # Databases
  postgres_data:
  redis_data:
  rabbitmq_data:

  # Monitoring
  prometheus_data:
  alertmanager_data:
  grafana_data:

  # Application
  backend_mlflow:
  gateway_data:
  ollama_data:

# Jaeger Tracing Service (PDCA #25)
#
# Add to main docker-compose.yml or use:
# docker-compose -f docker-compose.yml -f docker-compose.jaeger.yml up

version: '3.8'

services:
  # Jaeger all-in-one (development)
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: optiflow-jaeger
    environment:
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "5775:5775/udp"   # Zipkin compact thrift
      - "6831:6831/udp"   # Jaeger agent (thrift)
      - "6832:6832/udp"   # Jaeger agent (binary thrift)
      - "5778:5778"       # Serve configs
      - "16686:16686"     # Jaeger UI
      - "14250:14250"     # Model proto
      - "14268:14268"     # Jaeger collector HTTP
      - "14269:14269"     # Jaeger admin port
      - "4317:4317"       # OTLP gRPC
      - "4318:4318"       # OTLP HTTP
      - "9411:9411"       # Zipkin
    networks:
      - optiflow-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:14269/"]
      interval: 10s
      timeout: 3s
      retries: 3

networks:
  optiflow-network:
    external: true

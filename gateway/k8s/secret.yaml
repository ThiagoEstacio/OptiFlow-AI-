# ============================================================================
# OptiFlow Gateway - Kubernetes Secret
# ============================================================================
#
# Stores sensitive configuration (passwords, tokens, API keys).
# In production, use a secrets management tool (Vault, AWS Secrets Manager, etc.)
#
# To create from literal values:
#   kubectl create secret generic gateway-secret \
#     --from-literal=KAFKA_USERNAME=admin \
#     --from-literal=KAFKA_PASSWORD=secret \
#     -n optiflow-gateway
#
# To create from .env file:
#   kubectl create secret generic gateway-secret \
#     --from-env-file=.env.production \
#     -n optiflow-gateway
# ============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: gateway-secret
  namespace: optiflow-gateway
  labels:
    app: optiflow
    component: gateway

type: Opaque

# Base64 encoded values
# echo -n "value" | base64
stringData:
  # OPC-UA credentials (if required)
  OPCUA_USERNAME: ""
  OPCUA_PASSWORD: ""

  # Kafka credentials (if SASL enabled)
  KAFKA_USERNAME: ""
  KAFKA_PASSWORD: ""
  KAFKA_SASL_MECHANISM: "PLAIN"

  # Backend API key (for cloud sync)
  BACKEND_API_KEY: ""

  # InfluxDB token (if direct write enabled)
  INFLUXDB_TOKEN: ""

  # Redis password (if caching enabled)
  REDIS_PASSWORD: ""

  # JWT secret (for UI authentication)
  JWT_SECRET: "your-super-secret-jwt-key-change-in-production"

---
# ============================================================================
# TLS Certificate Secret (for HTTPS)
# ============================================================================
#
# To create from cert files:
#   kubectl create secret tls gateway-tls-cert \
#     --cert=path/to/tls.crt \
#     --key=path/to/tls.key \
#     -n optiflow-gateway
# ============================================================================
# apiVersion: v1
# kind: Secret
# metadata:
#   name: gateway-tls-cert
#   namespace: optiflow-gateway
# type: kubernetes.io/tls
# data:
#   tls.crt: <base64-encoded-cert>
#   tls.key: <base64-encoded-key>

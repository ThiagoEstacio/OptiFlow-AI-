# ============================================================================
# OptiFlow Gateway - Kubernetes Deployment
# ============================================================================
#
# Deploys the gateway as a stateful service with:
# - Rolling updates (zero downtime)
# - Health checks (liveness + readiness)
# - Resource limits (CPU + memory)
# - Persistent storage (SQLite buffer)
#
# Usage:
#   kubectl apply -f namespace.yaml
#   kubectl apply -f configmap.yaml
#   kubectl apply -f deployment.yaml
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: optiflow-gateway
  labels:
    app: optiflow
    component: gateway
    version: v2.0.0

spec:
  # Single replica for edge (one gateway per plant)
  # For HA, increase to 2-3 replicas
  replicas: 1

  # Rolling update strategy (zero downtime)
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0  # Keep at least 1 pod running
      maxSurge: 1        # Allow 1 extra pod during update

  selector:
    matchLabels:
      app: optiflow
      component: gateway

  template:
    metadata:
      labels:
        app: optiflow
        component: gateway
        version: v2.0.0

      annotations:
        # Force restart when ConfigMap changes
        checksum/config: "{{ include (print $.Template.BasePath \"/configmap.yaml\") . | sha256sum }}"

    spec:
      # Service account (for RBAC if needed)
      serviceAccountName: default

      # Security context (non-root user)
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000

      # Init container (optional - wait for dependencies)
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for Kafka..."
              until nc -z kafka 9092; do
                echo "Kafka not ready, sleeping 2s..."
                sleep 2
              done
              echo "Kafka is ready!"

      # Main container
      containers:
        - name: gateway
          image: optiflow-gateway:edge
          imagePullPolicy: IfNotPresent

          # Environment variables from ConfigMap
          envFrom:
            - configMapRef:
                name: gateway-config
            - secretRef:
                name: gateway-secret

          # Ports
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          # Volume mounts
          volumeMounts:
            # Configuration file
            - name: config
              mountPath: /app/config
              readOnly: true

            # Persistent data (SQLite buffer)
            - name: data
              mountPath: /app/data

            # Logs (optional - usually sent to stdout)
            - name: logs
              mountPath: /app/logs

          # Resource limits (adjust based on plant size)
          resources:
            requests:
              cpu: 500m      # 0.5 CPU cores
              memory: 512Mi  # 512 MB RAM
            limits:
              cpu: 2000m     # 2 CPU cores
              memory: 2Gi    # 2 GB RAM

          # Liveness probe (restart if unhealthy)
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 60  # Wait 60s after startup
            periodSeconds: 30        # Check every 30s
            timeoutSeconds: 10       # Timeout after 10s
            failureThreshold: 3      # Restart after 3 failures

          # Readiness probe (remove from load balancer if not ready)
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          # Startup probe (for slow-starting apps)
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12  # Allow up to 120s to start

          # Graceful shutdown (SIGTERM timeout)
          lifecycle:
            preStop:
              exec:
                command:
                  - sh
                  - -c
                  - |
                    echo "Graceful shutdown - flushing buffer..."
                    sleep 10

      # Volumes
      volumes:
        # Configuration from ConfigMap
        - name: config
          configMap:
            name: gateway-config
            items:
              - key: adapters_config.yaml
                path: adapters_config.yaml

        # Persistent data (SQLite buffer, cache)
        - name: data
          persistentVolumeClaim:
            claimName: gateway-data-pvc

        # Logs (emptyDir - ephemeral)
        - name: logs
          emptyDir: {}

      # Restart policy
      restartPolicy: Always

      # Node affinity (optional - pin to specific node)
      # affinity:
      #   nodeAffinity:
      #     requiredDuringSchedulingIgnoredDuringExecution:
      #       nodeSelectorTerms:
      #         - matchExpressions:
      #             - key: node-role.kubernetes.io/edge
      #               operator: In
      #               values:
      #                 - "true"

---
# ============================================================================
# Persistent Volume Claim (for SQLite buffer)
# ============================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gateway-data-pvc
  namespace: optiflow-gateway
  labels:
    app: optiflow
    component: gateway

spec:
  accessModes:
    - ReadWriteOnce  # Single node access (sufficient for edge)

  resources:
    requests:
      storage: 10Gi  # 10 GB for buffer + cache

  # Storage class (depends on cluster)
  # storageClassName: local-path  # K3s default
  # storageClassName: standard    # GKE
  # storageClassName: gp2          # AWS EKS

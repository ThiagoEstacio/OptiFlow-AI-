# PostgreSQL Primary Server Configuration
# ========================================
# Optimized for OptiFlow AI Platform - Primary with Replication

# -----------------------------
# CONNECTION SETTINGS
# -----------------------------
listen_addresses = '*'
port = 5432
max_connections = 200
superuser_reserved_connections = 3

# -----------------------------
# MEMORY SETTINGS
# -----------------------------
shared_buffers = 2GB                    # 25% of available RAM (8GB system)
effective_cache_size = 6GB              # 75% of available RAM
work_mem = 64MB                         # per-sort memory
maintenance_work_mem = 512MB            # for VACUUM, CREATE INDEX
wal_buffers = 64MB
huge_pages = try

# -----------------------------
# QUERY PLANNING
# -----------------------------
random_page_cost = 1.1                  # SSD optimized
effective_io_concurrency = 200          # SSD optimized
default_statistics_target = 100
jit = on

# -----------------------------
# WAL (WRITE AHEAD LOG)
# -----------------------------
wal_level = replica                     # Required for replication
max_wal_size = 4GB
min_wal_size = 1GB
wal_compression = on
wal_log_hints = on

# -----------------------------
# REPLICATION - PRIMARY
# -----------------------------
max_wal_senders = 10                    # Max replication connections
wal_keep_size = 2GB                     # WAL retention for replicas
max_replication_slots = 10
synchronous_commit = on                 # Full durability
hot_standby = on

# Synchronous replication (optional - for zero data loss)
# synchronous_standby_names = 'replica1'

# -----------------------------
# CHECKPOINT SETTINGS
# -----------------------------
checkpoint_completion_target = 0.9
checkpoint_timeout = 10min

# -----------------------------
# BACKGROUND WRITER
# -----------------------------
bgwriter_delay = 200ms
bgwriter_lru_maxpages = 100
bgwriter_lru_multiplier = 2.0

# -----------------------------
# LOGGING
# -----------------------------
logging_collector = on
log_directory = 'pg_log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_min_duration_statement = 1000       # Log queries > 1 second
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 0

# -----------------------------
# AUTOVACUUM
# -----------------------------
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 1min
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05
autovacuum_vacuum_cost_delay = 2ms

# -----------------------------
# CLIENT DEFAULTS
# -----------------------------
timezone = 'UTC'
lc_messages = 'en_US.UTF-8'
lc_monetary = 'en_US.UTF-8'
lc_numeric = 'en_US.UTF-8'
lc_time = 'en_US.UTF-8'
default_text_search_config = 'pg_catalog.english'

# -----------------------------
# LOCK MANAGEMENT
# -----------------------------
deadlock_timeout = 1s
max_locks_per_transaction = 256

# -----------------------------
# STATISTICS
# -----------------------------
track_activities = on
track_counts = on
track_io_timing = on
track_functions = all

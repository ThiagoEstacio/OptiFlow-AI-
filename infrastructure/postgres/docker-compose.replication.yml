# PostgreSQL Replication Configuration
# =====================================
# Primary-Replica setup for high availability
# Uses streaming replication for real-time sync

version: '3.8'

services:
  # ==========================================
  # PRIMARY DATABASE
  # ==========================================
  postgres-primary:
    image: postgres:15-alpine
    container_name: optiflow-postgres-primary
    restart: unless-stopped
    environment:
      - POSTGRES_USER=optiflow
      - POSTGRES_PASSWORD=${DB_PASSWORD:-optiflow_password}
      - POSTGRES_DB=optiflow
      - PGDATA=/var/lib/postgresql/data/pgdata
      # Replication settings
      - POSTGRES_REPLICATION_USER=replicator
      - POSTGRES_REPLICATION_PASSWORD=${REPLICATION_PASSWORD:-replication_password}
    volumes:
      - postgres-primary-data:/var/lib/postgresql/data
      - ./init-primary.sh:/docker-entrypoint-initdb.d/01-init-primary.sh
      - ./postgresql-primary.conf:/etc/postgresql/postgresql.conf
      - ./pg_hba-primary.conf:/etc/postgresql/pg_hba.conf
    command: postgres -c config_file=/etc/postgresql/postgresql.conf -c hba_file=/etc/postgresql/pg_hba.conf
    ports:
      - "5432:5432"
    networks:
      - postgres-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U optiflow -d optiflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '1'
          memory: 2G

  # ==========================================
  # REPLICA DATABASE 1
  # ==========================================
  postgres-replica-1:
    image: postgres:15-alpine
    container_name: optiflow-postgres-replica-1
    restart: unless-stopped
    environment:
      - POSTGRES_USER=optiflow
      - POSTGRES_PASSWORD=${DB_PASSWORD:-optiflow_password}
      - POSTGRES_DB=optiflow
      - PGDATA=/var/lib/postgresql/data/pgdata
      # Replication settings
      - PRIMARY_HOST=postgres-primary
      - PRIMARY_PORT=5432
      - REPLICATION_USER=replicator
      - REPLICATION_PASSWORD=${REPLICATION_PASSWORD:-replication_password}
    volumes:
      - postgres-replica-1-data:/var/lib/postgresql/data
      - ./init-replica.sh:/docker-entrypoint-initdb.d/01-init-replica.sh
      - ./postgresql-replica.conf:/etc/postgresql/postgresql.conf
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    ports:
      - "5433:5432"
    networks:
      - postgres-network
    depends_on:
      postgres-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U optiflow -d optiflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G

  # ==========================================
  # REPLICA DATABASE 2 (Optional - for read scaling)
  # ==========================================
  postgres-replica-2:
    image: postgres:15-alpine
    container_name: optiflow-postgres-replica-2
    restart: unless-stopped
    environment:
      - POSTGRES_USER=optiflow
      - POSTGRES_PASSWORD=${DB_PASSWORD:-optiflow_password}
      - POSTGRES_DB=optiflow
      - PGDATA=/var/lib/postgresql/data/pgdata
      - PRIMARY_HOST=postgres-primary
      - PRIMARY_PORT=5432
      - REPLICATION_USER=replicator
      - REPLICATION_PASSWORD=${REPLICATION_PASSWORD:-replication_password}
    volumes:
      - postgres-replica-2-data:/var/lib/postgresql/data
      - ./init-replica.sh:/docker-entrypoint-initdb.d/01-init-replica.sh
      - ./postgresql-replica.conf:/etc/postgresql/postgresql.conf
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    ports:
      - "5434:5432"
    networks:
      - postgres-network
    depends_on:
      postgres-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U optiflow -d optiflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G

  # ==========================================
  # PGPOOL-II - Connection Pooling & Load Balancing
  # ==========================================
  pgpool:
    image: bitnami/pgpool:4
    container_name: optiflow-pgpool
    restart: unless-stopped
    environment:
      - PGPOOL_BACKEND_NODES=0:postgres-primary:5432,1:postgres-replica-1:5432,2:postgres-replica-2:5432
      - PGPOOL_SR_CHECK_USER=replicator
      - PGPOOL_SR_CHECK_PASSWORD=${REPLICATION_PASSWORD:-replication_password}
      - PGPOOL_ENABLE_LDAP=no
      - PGPOOL_POSTGRES_USERNAME=optiflow
      - PGPOOL_POSTGRES_PASSWORD=${DB_PASSWORD:-optiflow_password}
      - PGPOOL_ADMIN_USERNAME=admin
      - PGPOOL_ADMIN_PASSWORD=${PGPOOL_ADMIN_PASSWORD:-admin_password}
      - PGPOOL_ENABLE_LOAD_BALANCING=yes
      - PGPOOL_NUM_INIT_CHILDREN=32
      - PGPOOL_MAX_POOL=4
      - PGPOOL_CHILD_LIFE_TIME=300
      - PGPOOL_CONNECTION_LIFE_TIME=0
      - PGPOOL_CLIENT_IDLE_LIMIT=0
    ports:
      - "5435:5432"
    networks:
      - postgres-network
    depends_on:
      - postgres-primary
      - postgres-replica-1
      - postgres-replica-2
    healthcheck:
      test: ["CMD", "/opt/bitnami/scripts/pgpool/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

networks:
  postgres-network:
    driver: bridge

volumes:
  postgres-primary-data:
  postgres-replica-1-data:
  postgres-replica-2-data:

# ============================================================================
# OptiFlow - Prometheus Alert Rules
# ============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: monitoring
data:
  optiflow-alerts.yml: |
    groups:
      # === SERVICE HEALTH ===
      - name: service_health
        interval: 30s
        rules:
          - alert: ServiceDown
            expr: up{job=~"optiflow-.*"} == 0
            for: 2m
            labels:
              severity: critical
              team: platform
            annotations:
              summary: "{{ $labels.job }} is down"
              description: "Service {{ $labels.job }} has been down for more than 2 minutes"

          - alert: HighErrorRate
            expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
            for: 5m
            labels:
              severity: warning
              team: platform
            annotations:
              summary: "High error rate on {{ $labels.job }}"
              description: "Error rate is {{ $value | humanizePercentage }} on {{ $labels.job }}"

      # === GATEWAY SPECIFIC ===
      - name: gateway_alerts
        interval: 30s
        rules:
          - alert: GatewayPLCDisconnected
            expr: gateway_plc_connected == 0
            for: 1m
            labels:
              severity: critical
              team: operations
            annotations:
              summary: "Gateway {{ $labels.adapter_id }} disconnected from PLC"
              description: "PLC connection lost for adapter {{ $labels.adapter_id }}"

          - alert: GatewayHighLatency
            expr: histogram_quantile(0.95, rate(gateway_api_latency_seconds_bucket[5m])) > 0.1
            for: 5m
            labels:
              severity: warning
              team: platform
            annotations:
              summary: "Gateway API high latency"
              description: "95th percentile latency is {{ $value }}s (threshold: 0.1s)"

          - alert: GatewayBufferFull
            expr: gateway_buffer_size_bytes / gateway_buffer_capacity_bytes > 0.9
            for: 5m
            labels:
              severity: warning
              team: operations
            annotations:
              summary: "Gateway buffer almost full"
              description: "Buffer is {{ $value | humanizePercentage }} full - Kafka may be down"

      # === BACKEND SPECIFIC ===
      - name: backend_alerts
        interval: 30s
        rules:
          - alert: KafkaConsumerLag
            expr: kafka_consumer_lag > 10000
            for: 5m
            labels:
              severity: warning
              team: platform
            annotations:
              summary: "High Kafka consumer lag"
              description: "Consumer lag is {{ $value }} messages behind"

          - alert: DatabaseConnectionPoolExhausted
            expr: db_connection_pool_active / db_connection_pool_size > 0.9
            for: 2m
            labels:
              severity: critical
              team: platform
            annotations:
              summary: "Database connection pool almost exhausted"
              description: "{{ $value | humanizePercentage }} of connections in use"

          - alert: InfluxDBWriteFailures
            expr: rate(influxdb_write_failures_total[5m]) > 0.01
            for: 5m
            labels:
              severity: warning
              team: platform
            annotations:
              summary: "InfluxDB write failures"
              description: "Failing to write {{ $value }} writes/second to InfluxDB"

      # === RESOURCE UTILIZATION ===
      - name: resource_alerts
        interval: 30s
        rules:
          - alert: HighCPUUsage
            expr: rate(process_cpu_seconds_total{job=~"optiflow-.*"}[5m]) > 0.8
            for: 10m
            labels:
              severity: warning
              team: platform
            annotations:
              summary: "High CPU usage on {{ $labels.job }}"
              description: "CPU usage is {{ $value | humanizePercentage }}"

          - alert: HighMemoryUsage
            expr: process_resident_memory_bytes{job=~"optiflow-.*"} / node_memory_MemTotal_bytes > 0.9
            for: 5m
            labels:
              severity: warning
              team: platform
            annotations:
              summary: "High memory usage on {{ $labels.job }}"
              description: "Memory usage is {{ $value | humanizePercentage }}"

          - alert: DiskSpaceLow
            expr: (node_filesystem_avail_bytes / node_filesystem_size_bytes) < 0.1
            for: 5m
            labels:
              severity: critical
              team: platform
            annotations:
              summary: "Low disk space on {{ $labels.instance }}"
              description: "Only {{ $value | humanizePercentage }} disk space remaining"

      # === BUSINESS METRICS ===
      - name: business_alerts
        interval: 60s
        rules:
          - alert: NoDataIngestion
            expr: rate(gateway_tags_published_total[5m]) == 0
            for: 10m
            labels:
              severity: critical
              team: operations
            annotations:
              summary: "No data being ingested"
              description: "Gateway has not published any tags for 10 minutes"

          - alert: AnomalousTagValue
            expr: abs(tag_value - tag_value offset 1h) / tag_value offset 1h > 0.5
            for: 5m
            labels:
              severity: warning
              team: operations
            annotations:
              summary: "Anomalous value detected for {{ $labels.tag_name }}"
              description: "Value changed by {{ $value | humanizePercentage }} in 1 hour"

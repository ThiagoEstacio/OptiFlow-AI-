# ============================================================================
# AlertManager - Alert Routing & Notification
# ============================================================================
#
# Routes alerts from Prometheus to different notification channels:
# - Critical alerts → PagerDuty (24/7 on-call)
# - Warnings → Slack (#alerts channel)
# - Info → Email
#
# Features:
# - Alert grouping (reduce notification spam)
# - Inhibition rules (suppress dependent alerts)
# - Silences (planned maintenance windows)
# - Alert deduplication
#
# Access: http://alertmanager.optiflow.local
# ============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  alertmanager.yml: |
    global:
      # Email configuration
      smtp_smarthost: 'smtp.gmail.com:587'
      smtp_from: 'alerts@optiflow.com'
      smtp_auth_username: 'alerts@optiflow.com'
      smtp_auth_password: '${SMTP_PASSWORD}'  # Set via secret
      smtp_require_tls: true

      # PagerDuty configuration
      pagerduty_url: 'https://events.pagerduty.com/v2/enqueue'

      # Slack configuration
      slack_api_url: '${SLACK_WEBHOOK_URL}'  # Set via secret

    # Templates for notification formatting
    templates:
      - '/etc/alertmanager/templates/*.tmpl'

    # Alert routing tree
    route:
      # Default receiver for all alerts
      receiver: 'default-email'

      # Group alerts by cluster, service, and severity
      group_by: ['cluster', 'alertname', 'severity']

      # Wait before sending notification (collect similar alerts)
      group_wait: 10s

      # Wait before sending follow-up notification for same group
      group_interval: 5m

      # Repeat notification if alert still firing
      repeat_interval: 4h

      # Route specific alerts to different receivers
      routes:
        # === CRITICAL ALERTS → PAGERDUTY ===
        - match:
            severity: critical
          receiver: 'pagerduty-critical'
          continue: true  # Also send to Slack

        # === WARNING ALERTS → SLACK ===
        - match:
            severity: warning
          receiver: 'slack-warnings'

        # === SERVICE-SPECIFIC ROUTING ===

        # Gateway alerts → Operations team
        - match_re:
            alertname: Gateway.*
          receiver: 'slack-operations'
          routes:
            # Critical gateway alerts also page on-call
            - match:
                severity: critical
              receiver: 'pagerduty-operations'

        # Backend/Platform alerts → Platform team
        - match:
            team: platform
          receiver: 'slack-platform'
          routes:
            - match:
                severity: critical
              receiver: 'pagerduty-platform'

        # Business metric alerts → Operations + Business teams
        - match_re:
            alertname: (NoDataIngestion|AnomalousTagValue)
          receiver: 'slack-business'
          group_wait: 30s  # Wait longer to avoid false positives

    # Inhibition rules - suppress dependent alerts
    inhibit_rules:
      # If service is down, suppress high latency alerts
      - source_match:
          alertname: 'ServiceDown'
        target_match:
          alertname: 'HighLatency'
        equal: ['job']

      # If PLC is disconnected, suppress all gateway alerts for that adapter
      - source_match:
          alertname: 'GatewayPLCDisconnected'
        target_match_re:
          alertname: 'Gateway.*'
        equal: ['adapter_id']

      # If Kafka is down, suppress consumer lag alerts
      - source_match:
          alertname: 'ServiceDown'
          job: 'kafka'
        target_match:
          alertname: 'KafkaConsumerLag'

    # Notification receivers
    receivers:
      # === DEFAULT EMAIL ===
      - name: 'default-email'
        email_configs:
          - to: 'ops@optiflow.com'
            headers:
              Subject: '[{{ .Status | toUpper }}] {{ .GroupLabels.alertname }}'
            html: '{{ template "email.default.html" . }}'

      # === PAGERDUTY (24/7 on-call) ===
      - name: 'pagerduty-critical'
        pagerduty_configs:
          - service_key: '${PAGERDUTY_SERVICE_KEY_CRITICAL}'
            description: '{{ .GroupLabels.alertname }}: {{ .Annotations.summary }}'
            details:
              firing: '{{ template "pagerduty.default.instances" .Alerts.Firing }}'
              num_firing: '{{ .Alerts.Firing | len }}'
              num_resolved: '{{ .Alerts.Resolved | len }}'
              resolved: '{{ template "pagerduty.default.instances" .Alerts.Resolved }}'

      - name: 'pagerduty-operations'
        pagerduty_configs:
          - service_key: '${PAGERDUTY_SERVICE_KEY_OPERATIONS}'

      - name: 'pagerduty-platform'
        pagerduty_configs:
          - service_key: '${PAGERDUTY_SERVICE_KEY_PLATFORM}'

      # === SLACK CHANNELS ===
      - name: 'slack-warnings'
        slack_configs:
          - channel: '#alerts'
            color: '{{ if eq .Status "firing" }}warning{{ else }}good{{ end }}'
            title: '{{ .GroupLabels.alertname }}'
            text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
            fields:
              - title: 'Severity'
                value: '{{ .GroupLabels.severity }}'
                short: true
              - title: 'Cluster'
                value: '{{ .GroupLabels.cluster }}'
                short: true

      - name: 'slack-operations'
        slack_configs:
          - channel: '#ops-alerts'
            color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'
            title: '{{ .GroupLabels.alertname }}'
            text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'

      - name: 'slack-platform'
        slack_configs:
          - channel: '#platform-alerts'
            color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'
            title: '{{ .GroupLabels.alertname }}'
            text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'

      - name: 'slack-business'
        slack_configs:
          - channel: '#business-metrics'
            color: 'warning'
            title: 'Business Metric Alert'
            text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-templates
  namespace: monitoring
data:
  # Email template
  email.tmpl: |
    {{ define "email.default.html" }}
    <!DOCTYPE html>
    <html>
    <head>
      <style>
        body { font-family: Arial, sans-serif; }
        .alert { padding: 10px; margin: 10px 0; border-left: 4px solid; }
        .critical { border-color: #d32f2f; background: #ffebee; }
        .warning { border-color: #f57c00; background: #fff3e0; }
        .info { border-color: #1976d2; background: #e3f2fd; }
      </style>
    </head>
    <body>
      <h2>OptiFlow Alert: {{ .GroupLabels.alertname }}</h2>
      <p><strong>Status:</strong> {{ .Status | toUpper }}</p>
      <p><strong>Severity:</strong> {{ .GroupLabels.severity }}</p>
      <p><strong>Cluster:</strong> {{ .GroupLabels.cluster }}</p>

      <h3>Firing Alerts ({{ .Alerts.Firing | len }})</h3>
      {{ range .Alerts.Firing }}
      <div class="alert {{ .Labels.severity }}">
        <p><strong>{{ .Annotations.summary }}</strong></p>
        <p>{{ .Annotations.description }}</p>
        <p><small>Started: {{ .StartsAt }}</small></p>
      </div>
      {{ end }}

      {{ if .Alerts.Resolved }}
      <h3>Resolved Alerts ({{ .Alerts.Resolved | len }})</h3>
      {{ range .Alerts.Resolved }}
      <div class="alert info">
        <p><strong>{{ .Annotations.summary }}</strong></p>
        <p><small>Resolved: {{ .EndsAt }}</small></p>
      </div>
      {{ end }}
      {{ end }}
    </body>
    </html>
    {{ end }}

---
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-secrets
  namespace: monitoring
type: Opaque
stringData:
  # IMPORTANT: Replace with actual credentials in production!
  # Use Sealed Secrets or External Secrets Operator for GitOps

  SMTP_PASSWORD: 'changeme'
  SLACK_WEBHOOK_URL: 'https://hooks.slack.com/services/YOUR/WEBHOOK/URL'
  PAGERDUTY_SERVICE_KEY_CRITICAL: 'changeme'
  PAGERDUTY_SERVICE_KEY_OPERATIONS: 'changeme'
  PAGERDUTY_SERVICE_KEY_PLATFORM: 'changeme'

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.26.0
          args:
            - '--config.file=/etc/alertmanager/alertmanager.yml'
            - '--storage.path=/alertmanager'
            - '--web.external-url=http://alertmanager.optiflow.local'
          ports:
            - containerPort: 9093
              name: http
          env:
            # Inject secrets as environment variables
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: alertmanager-secrets
                  key: SMTP_PASSWORD
            - name: SLACK_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: alertmanager-secrets
                  key: SLACK_WEBHOOK_URL
            - name: PAGERDUTY_SERVICE_KEY_CRITICAL
              valueFrom:
                secretKeyRef:
                  name: alertmanager-secrets
                  key: PAGERDUTY_SERVICE_KEY_CRITICAL
            - name: PAGERDUTY_SERVICE_KEY_OPERATIONS
              valueFrom:
                secretKeyRef:
                  name: alertmanager-secrets
                  key: PAGERDUTY_SERVICE_KEY_OPERATIONS
            - name: PAGERDUTY_SERVICE_KEY_PLATFORM
              valueFrom:
                secretKeyRef:
                  name: alertmanager-secrets
                  key: PAGERDUTY_SERVICE_KEY_PLATFORM
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
            - name: templates
              mountPath: /etc/alertmanager/templates
            - name: storage
              mountPath: /alertmanager
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: alertmanager-config
        - name: templates
          configMap:
            name: alertmanager-templates
        - name: storage
          persistentVolumeClaim:
            claimName: alertmanager-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  type: ClusterIP
  ports:
    - port: 9093
      targetPort: 9093
      name: http
  selector:
    app: alertmanager

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: alertmanager-pvc
  namespace: monitoring
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: alertmanager
  namespace: monitoring
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Basic auth for security
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: alertmanager-basic-auth
    nginx.ingress.kubernetes.io/auth-realm: 'Authentication Required - OptiFlow AlertManager'
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - alertmanager.optiflow.local
      secretName: alertmanager-tls
  rules:
    - host: alertmanager.optiflow.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: alertmanager
                port:
                  number: 9093

---
# Basic auth secret (create with: htpasswd -c auth admin)
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-basic-auth
  namespace: monitoring
type: Opaque
stringData:
  # Default: admin / optiflow123
  # CHANGE IN PRODUCTION!
  auth: |
    admin:$apr1$8ZHX0qKq$8qLH3b0yW5JqX6VtYXH8G0

# Prometheus Configuration for OptiFlow AI Platform
# ==================================================

global:
  scrape_interval: 15s          # Default scrape interval
  evaluation_interval: 15s       # Rule evaluation interval
  external_labels:
    environment: production
    platform: optiflow

# Alerting configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

# Rule files
rule_files:
  - /etc/prometheus/rules/*.yml

# Scrape configurations
scrape_configs:
  # ==================================
  # PROMETHEUS SELF-MONITORING
  # ==================================
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    metrics_path: /metrics

  # ==================================
  # OPTIFLOW BACKEND API
  # ==================================
  - job_name: 'optiflow-backend'
    static_configs:
      - targets: ['backend:8000']
    metrics_path: /metrics
    scrape_interval: 10s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: '(.+):\d+'
        replacement: '${1}'

  # ==================================
  # TRAEFIK LOAD BALANCER
  # ==================================
  - job_name: 'traefik'
    static_configs:
      - targets: ['traefik:8082']
    metrics_path: /metrics

  # ==================================
  # POSTGRESQL
  # ==================================
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
    metrics_path: /metrics

  # ==================================
  # REDIS
  # ==================================
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    metrics_path: /metrics

  # ==================================
  # INFLUXDB
  # ==================================
  - job_name: 'influxdb'
    static_configs:
      - targets: ['influxdb:8086']
    metrics_path: /metrics

  # ==================================
  # KAFKA
  # ==================================
  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka-exporter:9308']
    metrics_path: /metrics

  # ==================================
  # NODE EXPORTER (System Metrics)
  # ==================================
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
    metrics_path: /metrics

  # ==================================
  # CADVISOR (Container Metrics)
  # ==================================
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    metrics_path: /metrics

  # ==================================
  # OLLAMA (LLM Metrics)
  # ==================================
  - job_name: 'ollama'
    static_configs:
      - targets: ['ollama:11434']
    metrics_path: /api/metrics
    scrape_interval: 30s

  # ==================================
  # MLFLOW
  # ==================================
  - job_name: 'mlflow'
    static_configs:
      - targets: ['mlflow:5000']
    metrics_path: /metrics
    scrape_interval: 30s

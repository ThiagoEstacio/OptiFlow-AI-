# OptiFlow AI - Prometheus Configuration
# ==========================================
# Configuração completa para coleta de métricas
# Backend, Gateway, System e Infrastructure

global:
  scrape_interval: 15s        # Coleta métricas a cada 15s
  evaluation_interval: 15s    # Avalia regras a cada 15s
  scrape_timeout: 10s         # Timeout para scraping
  external_labels:
    cluster: 'optiflow-production'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Load rules once and periodically evaluate them
rule_files:
  - "/etc/prometheus/alerts/*.yml"

# Scrape configurations
scrape_configs:
  # ======================================================================
  # PROMETHEUS ITSELF
  # ======================================================================
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'
          component: 'monitoring'

  # ======================================================================
  # BACKEND API (FastAPI)
  # ======================================================================
  - job_name: 'optiflow-backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend:8000']
        labels:
          service: 'backend'
          component: 'api'
          app: 'optiflow'
    scrape_interval: 10s        # Mais frequente para API
    scrape_timeout: 5s
    
  # ======================================================================
  # GATEWAY (IoT Device Manager)
  # ======================================================================
  - job_name: 'optiflow-gateway'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['gateway:8001']
        labels:
          service: 'gateway'
          component: 'device-manager'
          app: 'optiflow'
    scrape_interval: 10s        # Frequente para monitorar devices

  # ======================================================================
  # POSTGRESQL DATABASE
  # ======================================================================
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'postgres'
          component: 'database'

  # ======================================================================
  # REDIS CACHE
  # ======================================================================
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: 'redis'
          component: 'cache'

  # ======================================================================
  # INFLUXDB TIME-SERIES DATABASE
  # ======================================================================
  - job_name: 'influxdb'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['influxdb:8086']
        labels:
          service: 'influxdb'
          component: 'timeseries'

  # ======================================================================
  # NODE EXPORTER (Host/System Metrics)
  # ======================================================================
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'node-exporter'
          component: 'system'
  
  # ======================================================================
  # CADVISOR (Container Metrics)
  # ======================================================================
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          service: 'cadvisor'
          component: 'containers'
    scrape_interval: 30s        # Menos frequente para containers

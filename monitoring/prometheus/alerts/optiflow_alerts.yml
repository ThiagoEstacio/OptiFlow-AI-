groups:
  # ========================================
  # OptiFlow Application Alerts
  # ========================================

  - name: optiflow_application
    interval: 30s
    rules:
      # Backend Down
      - alert: OptiFlowBackendDown
        expr: up{job="backend"} == 0
        for: 1m
        labels:
          severity: critical
          component: backend
        annotations:
          summary: "OptiFlow backend is down"
          description: "Backend API at {{ $labels.instance }} has been down for more than 1 minute."

      # High Request Latency
      - alert: HighRequestLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 1
        for: 5m
        labels:
          severity: warning
          component: backend
        annotations:
          summary: "High request latency detected"
          description: "95th percentile latency is {{ $value }}s on {{ $labels.endpoint }}"

      # High Error Rate
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
          component: backend
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value | humanizePercentage }} on {{ $labels.endpoint }}"

  # ========================================
  # Database Alerts
  # ========================================

  - name: optiflow_database
    interval: 30s
    rules:
      # PostgreSQL Down
      - alert: PostgreSQLDown
        expr: up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
          component: database
        annotations:
          summary: "PostgreSQL is down"
          description: "PostgreSQL at {{ $labels.instance }} has been down for more than 1 minute."

      # High Database Connections
      - alert: HighDatabaseConnections
        expr: db_connections_active > 50
        for: 5m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "High number of database connections"
          description: "Database has {{ $value }} active connections (threshold: 50)"

      # Redis Down
      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 1m
        labels:
          severity: warning
          component: cache
        annotations:
          summary: "Redis is down"
          description: "Redis at {{ $labels.instance }} has been down for more than 1 minute."

      # InfluxDB Down
      - alert: InfluxDBDown
        expr: up{job="influxdb"} == 0
        for: 1m
        labels:
          severity: critical
          component: timeseries
        annotations:
          summary: "InfluxDB is down"
          description: "InfluxDB at {{ $labels.instance }} has been down for more than 1 minute."

  # ========================================
  # Gateway Alerts
  # ========================================

  - name: optiflow_gateway
    interval: 30s
    rules:
      # Gateway Down
      - alert: GatewayDown
        expr: up{job="gateway"} == 0
        for: 2m
        labels:
          severity: critical
          component: gateway
        annotations:
          summary: "Gateway is down"
          description: "Gateway at {{ $labels.instance }} has been down for more than 2 minutes."

      # Gateway Disconnected
      - alert: GatewayDisconnected
        expr: gateway_connection_status == 0
        for: 5m
        labels:
          severity: warning
          component: gateway
        annotations:
          summary: "Gateway disconnected"
          description: "Gateway {{ $labels.gateway_name }} (ID: {{ $labels.gateway_id }}) is disconnected"

  # ========================================
  # Extended Tags (PI AF) Alerts
  # ========================================

  - name: optiflow_extended_tags
    interval: 1m
    rules:
      # No Tags Configured
      - alert: NoTagsConfigured
        expr: sum(extended_tags_total) == 0
        for: 10m
        labels:
          severity: info
          component: tags
        annotations:
          summary: "No extended tags configured"
          description: "No extended tags are configured in the system"

      # High Tag Calculation Failures
      - alert: HighTagCalculationFailures
        expr: rate(tag_calculations_total{success="false"}[5m]) / rate(tag_calculations_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
          component: tags
        annotations:
          summary: "High tag calculation failure rate"
          description: "Tag calculation failure rate is {{ $value | humanizePercentage }}"

  # ========================================
  # System Resources Alerts
  # ========================================

  - name: optiflow_system
    interval: 30s
    rules:
      # High CPU Usage
      - alert: HighCPUUsage
        expr: rate(process_cpu_seconds_total[5m]) > 0.8
        for: 5m
        labels:
          severity: warning
          component: system
        annotations:
          summary: "High CPU usage"
          description: "CPU usage is {{ $value | humanizePercentage }} on {{ $labels.instance }}"

      # High Memory Usage
      - alert: HighMemoryUsage
        expr: process_resident_memory_bytes > 1e9
        for: 5m
        labels:
          severity: warning
          component: system
        annotations:
          summary: "High memory usage"
          description: "Memory usage is {{ $value | humanize }}B on {{ $labels.instance }}"

      # Too Many Open File Descriptors
      - alert: TooManyOpenFiles
        expr: process_open_fds / process_max_fds > 0.8
        for: 5m
        labels:
          severity: warning
          component: system
        annotations:
          summary: "Too many open file descriptors"
          description: "Open FDs: {{ $value | humanizePercentage }} of max on {{ $labels.instance }}"

  # ========================================
  # AI Agent Alerts
  # ========================================

  - name: optiflow_ai_agent
    interval: 1m
    rules:
      # High AI Agent Failure Rate
      - alert: HighAIAgentFailureRate
        expr: rate(ai_agent_interactions_total{success="false"}[10m]) / rate(ai_agent_interactions_total[10m]) > 0.2
        for: 5m
        labels:
          severity: warning
          component: ai-agent
        annotations:
          summary: "High AI agent failure rate"
          description: "AI agent {{ $labels.agent_type }} failure rate is {{ $value | humanizePercentage }}"

      # Slow AI Agent Response
      - alert: SlowAIAgentResponse
        expr: histogram_quantile(0.95, rate(ai_agent_response_duration_seconds_bucket[5m])) > 30
        for: 5m
        labels:
          severity: warning
          component: ai-agent
        annotations:
          summary: "Slow AI agent responses"
          description: "95th percentile AI agent response time is {{ $value }}s for {{ $labels.agent_type }}"

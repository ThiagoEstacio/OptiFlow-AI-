groups:
  - name: optiflow_critical_alerts
    interval: 30s
    rules:
      # ============================================
      # Service Health Alerts
      # ============================================
      
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
          component: infrastructure
        annotations:
          summary: "Serviço {{ $labels.job }} está DOWN"
          description: "O serviço {{ $labels.job }} na instância {{ $labels.instance }} não está respondendo por mais de 1 minuto."
          action: "Verificar logs do container: docker logs {{ $labels.job }}"
          runbook: "https://docs.optiflow.ai/runbooks/service-down"

      - alert: HighErrorRate
        expr: |
          (
            sum(rate(http_requests_total{status=~"5.."}[5m])) by (job)
            /
            sum(rate(http_requests_total[5m])) by (job)
          ) > 0.05
        for: 2m
        labels:
          severity: critical
          component: application
        annotations:
          summary: "Taxa de erro alta no {{ $labels.job }}"
          description: "{{ $labels.job }} está apresentando {{ $value | humanizePercentage }} de erros 5xx nos últimos 5 minutos."
          action: "Verificar logs de aplicação e traces distribuídos"
          runbook: "https://docs.optiflow.ai/runbooks/high-error-rate"

      # ============================================
      # Resource Utilization Alerts
      # ============================================

      - alert: HighMemoryUsage
        expr: |
          (
            (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) 
            / node_memory_MemTotal_bytes
          ) * 100 > 90
        for: 5m
        labels:
          severity: critical
          component: infrastructure
        annotations:
          summary: "Uso de memória crítico"
          description: "Memória utilizada está em {{ $value | humanize }}% no host {{ $labels.instance }}."
          action: "Identificar processos: docker stats --no-stream | sort -k7 -h"
          runbook: "https://docs.optiflow.ai/runbooks/high-memory"

      - alert: HighCPUUsage
        expr: |
          (
            100 - (avg by (instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)
          ) > 90
        for: 10m
        labels:
          severity: warning
          component: infrastructure
        annotations:
          summary: "Uso de CPU alto"
          description: "CPU utilizada está em {{ $value | humanize }}% no host {{ $labels.instance }} por mais de 10 minutos."
          action: "Verificar processos: top -b -n 1 | head -20"
          runbook: "https://docs.optiflow.ai/runbooks/high-cpu"

      - alert: DiskSpaceLow
        expr: |
          (
            (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100
          ) < 15
        for: 5m
        labels:
          severity: critical
          component: infrastructure
        annotations:
          summary: "Espaço em disco crítico"
          description: "Apenas {{ $value | humanize }}% de espaço disponível em {{ $labels.mountpoint }}."
          action: "Limpar logs antigos e executar docker system prune"
          runbook: "https://docs.optiflow.ai/runbooks/disk-space"

      # ============================================
      # Performance Alerts
      # ============================================

      - alert: SlowRequests
        expr: |
          histogram_quantile(0.95, 
            sum(rate(http_request_duration_seconds_bucket[5m])) by (job, le)
          ) > 2
        for: 5m
        labels:
          severity: warning
          component: performance
        annotations:
          summary: "Requisições lentas no {{ $labels.job }}"
          description: "P95 de latência está em {{ $value }}s, acima do SLO de 2s."
          action: "Analisar traces no Jaeger e verificar queries lentas"
          runbook: "https://docs.optiflow.ai/runbooks/slow-requests"

      - alert: DatabaseConnectionPoolExhausted
        expr: |
          (
            sum(pg_stat_activity_count) by (instance) 
            / 
            sum(pg_settings_max_connections) by (instance)
          ) > 0.9
        for: 2m
        labels:
          severity: critical
          component: database
        annotations:
          summary: "Pool de conexões PostgreSQL quase esgotado"
          description: "{{ $value | humanizePercentage }} das conexões estão em uso."
          action: "Verificar conexões ociosas e aumentar pool se necessário"
          runbook: "https://docs.optiflow.ai/runbooks/db-pool"

      # ============================================
      # Application-Specific Alerts
      # ============================================

      - alert: AgentUnhealthy
        expr: optiflow_agent_health_status != 1
        for: 3m
        labels:
          severity: critical
          component: ai_agent
        annotations:
          summary: "Agente Autônomo não está saudável"
          description: "O agente {{ $labels.agent_id }} está reportando status não-saudável."
          action: "Verificar logs: docker logs smartport-autonomous-agent"
          runbook: "https://docs.optiflow.ai/runbooks/agent-unhealthy"

      - alert: OllamaDown
        expr: up{job="ollama"} == 0
        for: 1m
        labels:
          severity: critical
          component: ml_inference
        annotations:
          summary: "Ollama LLM Service está DOWN"
          description: "Serviço de inferência Ollama não está respondendo."
          action: "Verificar GPU e reiniciar: docker restart smartport-ollama"
          runbook: "https://docs.optiflow.ai/runbooks/ollama-down"

      - alert: HighMLInferenceLatency
        expr: |
          histogram_quantile(0.95,
            sum(rate(optiflow_ml_inference_duration_seconds_bucket[5m])) by (model, le)
          ) > 5
        for: 5m
        labels:
          severity: warning
          component: ml_inference
        annotations:
          summary: "Latência alta na inferência do modelo {{ $labels.model }}"
          description: "P95 de latência está em {{ $value }}s para o modelo {{ $labels.model }}."
          action: "Verificar carga da GPU e considerar otimização do modelo"
          runbook: "https://docs.optiflow.ai/runbooks/ml-latency"

      # ============================================
      # Data Quality Alerts
      # ============================================

      - alert: InfluxDBWriteFailures
        expr: |
          sum(rate(influxdb_write_errors_total[5m])) by (instance) > 10
        for: 2m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "Falhas de escrita no InfluxDB"
          description: "{{ $value }} erros de escrita por segundo no InfluxDB."
          action: "Verificar logs do InfluxDB e espaço em disco"
          runbook: "https://docs.optiflow.ai/runbooks/influx-writes"

      - alert: DataIngestionStopped
        expr: |
          rate(optiflow_data_points_ingested_total[5m]) == 0
        for: 10m
        labels:
          severity: critical
          component: data_pipeline
        annotations:
          summary: "Ingestão de dados parou"
          description: "Nenhum dado sendo ingerido nos últimos 10 minutos."
          action: "Verificar gateway e dispositivos conectados"
          runbook: "https://docs.optiflow.ai/runbooks/data-ingestion"

      # ============================================
      # Backup Alerts
      # ============================================

      - alert: BackupFailed
        expr: time() - optiflow_backup_last_success_timestamp > 93600  # 26 hours
        for: 1m
        labels:
          severity: critical
          component: backup
        annotations:
          summary: "Backup não executado nas últimas 26 horas"
          description: "Último backup bem-sucedido foi há {{ $value | humanizeDuration }} atrás."
          action: "Executar backup manual e verificar cron: ./scripts/backup-production.sh"
          runbook: "https://docs.optiflow.ai/runbooks/backup-failed"

      - alert: BackupSizeTooSmall
        expr: optiflow_backup_size_bytes < 10485760  # 10MB
        for: 1m
        labels:
          severity: warning
          component: backup
        annotations:
          summary: "Tamanho do backup suspeito"
          description: "Último backup tem apenas {{ $value | humanize1024 }}B."
          action: "Verificar integridade do backup e re-executar se necessário"
          runbook: "https://docs.optiflow.ai/runbooks/backup-size"

      # ============================================
      # Security Alerts
      # ============================================

      - alert: TooManyFailedLogins
        expr: |
          sum(rate(optiflow_failed_login_attempts_total[5m])) by (username) > 5
        for: 1m
        labels:
          severity: warning
          component: security
        annotations:
          summary: "Muitas tentativas de login falhadas"
          description: "Usuário {{ $labels.username }} teve {{ $value }} tentativas falhadas de login nos últimos 5 minutos."
          action: "Investigar possível ataque de força bruta e considerar bloqueio"
          runbook: "https://docs.optiflow.ai/runbooks/failed-logins"

      - alert: SSLCertificateExpiring
        expr: |
          (ssl_certificate_expiry_seconds - time()) / 86400 < 30
        for: 1h
        labels:
          severity: warning
          component: security
        annotations:
          summary: "Certificado SSL expirando em breve"
          description: "Certificado SSL {{ $labels.domain }} expira em {{ $value }} dias."
          action: "Renovar certificado: certbot renew"
          runbook: "https://docs.optiflow.ai/runbooks/ssl-renewal"

# SmartPort Grafana Dashboards Configuration

apiVersion: 1

providers:
  - name: 'SmartPort Dashboards'
    orgId: 1
    folder: 'SmartPort'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: true

# ============================================
# OptiFlow AI Platform - Alertmanager Configuration
# ============================================
#
# Production alerting configuration with multiple notification channels:
# - Email for critical alerts
# - Slack for team notifications
# - PagerDuty for on-call (optional)
#
# Configure the receivers with your actual credentials before deploying.
# ============================================

global:
  # SMTP configuration for email alerts
  smtp_smarthost: '${SMTP_HOST:-smtp.gmail.com:587}'
  smtp_from: '${SMTP_FROM:-optiflow-alerts@example.com}'
  smtp_auth_username: '${SMTP_USER:-}'
  smtp_auth_password: '${SMTP_PASSWORD:-}'
  smtp_require_tls: true

  # Slack API URL (webhook)
  slack_api_url: '${SLACK_WEBHOOK_URL:-}'

  # Default resolve timeout
  resolve_timeout: 5m

# Routing tree for alerts
route:
  # Group alerts by these labels
  group_by: ['alertname', 'severity', 'service']

  # Wait before sending first notification
  group_wait: 30s

  # Wait before sending updates for existing groups
  group_interval: 5m

  # Wait before resending notifications
  repeat_interval: 4h

  # Default receiver
  receiver: 'team-notifications'

  # Child routes for specific alerts
  routes:
    # Critical alerts - immediate notification
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 10s
      repeat_interval: 1h
      continue: true

    # Database alerts - DBA team
    - match:
        service: database
      receiver: 'database-team'
      group_wait: 1m
      repeat_interval: 2h

    # Kafka/Pipeline alerts - Data team
    - match:
        service: kafka
      receiver: 'data-team'
      group_wait: 1m
      repeat_interval: 2h

    - match:
        service: pipeline
      receiver: 'data-team'
      group_wait: 1m
      repeat_interval: 2h

    # Gateway/OT alerts - Operations team
    - match:
        service: gateway
      receiver: 'operations-team'
      group_wait: 30s
      repeat_interval: 1h

    # ML/AI alerts - ML team
    - match:
        service: ml
      receiver: 'ml-team'
      group_wait: 5m
      repeat_interval: 4h

    # Warning alerts - team channel
    - match:
        severity: warning
      receiver: 'team-notifications'
      group_wait: 2m
      repeat_interval: 6h

# Inhibition rules to reduce noise
inhibit_rules:
  # If critical alert is firing, suppress warning for same service
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'service', 'instance']

  # If service is down, suppress other alerts for that service
  - source_match:
      alertname: 'ServiceDown'
    target_match_re:
      alertname: '.+'
    equal: ['service']

# Notification receivers
receivers:
  # Default team notifications (Slack + Email summary)
  - name: 'team-notifications'
    slack_configs:
      - channel: '#optiflow-alerts'
        send_resolved: true
        title: '{{ if eq .Status "firing" }}:fire:{{ else }}:white_check_mark:{{ end }} OptiFlow Alert'
        text: |
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Severity:* {{ .Labels.severity }}
          *Service:* {{ .Labels.service }}
          {{ if .Annotations.runbook }}*Runbook:* {{ .Annotations.runbook }}{{ end }}
          {{ end }}
        actions:
          - type: button
            text: 'View in Grafana'
            url: '{{ .ExternalURL }}'
    email_configs:
      - to: '${ALERT_EMAIL:-ops@example.com}'
        send_resolved: true
        html: |
          <h2>OptiFlow Alert Summary</h2>
          <p><strong>Status:</strong> {{ .Status }}</p>
          <table>
            <tr><th>Alert</th><th>Severity</th><th>Service</th></tr>
            {{ range .Alerts }}
            <tr>
              <td>{{ .Labels.alertname }}</td>
              <td>{{ .Labels.severity }}</td>
              <td>{{ .Labels.service }}</td>
            </tr>
            {{ end }}
          </table>

  # Critical alerts - immediate attention required
  - name: 'critical-alerts'
    slack_configs:
      - channel: '#optiflow-critical'
        send_resolved: true
        color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'
        title: ':rotating_light: CRITICAL ALERT :rotating_light:'
        text: |
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Impact:* {{ .Annotations.impact }}
          *Service:* {{ .Labels.service }}
          *Instance:* {{ .Labels.instance }}
          {{ if .Annotations.runbook }}*Runbook:* <{{ .Annotations.runbook }}|Click here>{{ end }}
          {{ end }}
    email_configs:
      - to: '${CRITICAL_EMAIL:-oncall@example.com}'
        send_resolved: true
        headers:
          Subject: '[CRITICAL] OptiFlow: {{ .CommonLabels.alertname }}'

  # Database team
  - name: 'database-team'
    slack_configs:
      - channel: '#optiflow-database'
        send_resolved: true
        title: ':floppy_disk: Database Alert'
        text: |
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Service:* {{ .Labels.service }}
          *Instance:* {{ .Labels.instance }}
          {{ end }}

  # Data/Pipeline team
  - name: 'data-team'
    slack_configs:
      - channel: '#optiflow-data'
        send_resolved: true
        title: ':bar_chart: Data Pipeline Alert'
        text: |
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Topic/Partition:* {{ .Labels.topic }}/{{ .Labels.partition }}
          {{ end }}

  # Operations team (Gateway/OT)
  - name: 'operations-team'
    slack_configs:
      - channel: '#optiflow-operations'
        send_resolved: true
        title: ':factory: Operations Alert'
        text: |
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Gateway:* {{ .Labels.gateway }}
          *Device:* {{ .Labels.device }}
          {{ end }}

  # ML team
  - name: 'ml-team'
    slack_configs:
      - channel: '#optiflow-ml'
        send_resolved: true
        title: ':robot_face: ML/AI Alert'
        text: |
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Model:* {{ .Labels.model }}
          *Metric:* {{ .Labels.metric }}
          {{ end }}

  # Null receiver for silenced alerts
  - name: 'null'

# Templates
templates:
  - '/etc/alertmanager/templates/*.tmpl'

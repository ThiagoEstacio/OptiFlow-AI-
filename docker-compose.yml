services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: optiflow-postgres
    environment:
      POSTGRES_DB: optiflow
      POSTGRES_USER: optiflow
      POSTGRES_PASSWORD: optiflow_password
      POSTGRES_INITDB_ARGS: "-E UTF8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - optiflow-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U optiflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # InfluxDB Time Series Database
  influxdb:
    image: influxdb:2.7-alpine
    container_name: optiflow-influxdb
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: adminpassword
      DOCKER_INFLUXDB_INIT_ORG: optiflow
      DOCKER_INFLUXDB_INIT_BUCKET: timeseries
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: my-super-secret-influxdb-token
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    ports:
      - "8086:8086"
    networks:
      - optiflow-network
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache & Pub/Sub
  redis:
    image: redis:7-alpine
    container_name: optiflow-redis
    command: redis-server --appendonly yes --requirepass optiflow_redis_password
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - optiflow-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: optiflow-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: optiflow
      RABBITMQ_DEFAULT_PASS: optiflow_password
      RABBITMQ_DEFAULT_VHOST: /
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - optiflow-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Zookeeper - Kafka Coordination Service
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: optiflow-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SYNC_LIMIT: 2
    ports:
      - "2181:2181"
    networks:
      - optiflow-network
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafka - Real-time Streaming Platform
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: optiflow-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_COMPRESSION_TYPE: lz4
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - optiflow-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5

  # Kafka UI - Web Interface for Kafka Management
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: optiflow-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: optiflow
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
      DYNAMIC_CONFIG_ENABLED: 'true'
    networks:
      - optiflow-network

  # Ollama - Local LLM for AI Assistant
  # Note: GPU support is commented by default for CPU-only systems
  # Uncomment the 'deploy' section below if you have NVIDIA GPU available
  # Port 11435 used to avoid conflict with host Ollama (if running on 11434)
  ollama:
    image: ollama/ollama:latest
    container_name: optiflow-ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11435:11434"  # Container Ollama on 11435, host Ollama can use 11434
    networks:
      - optiflow-network
    environment:
      - OLLAMA_HOST=0.0.0.0
    # Uncomment for GPU support (requires NVIDIA GPU + nvidia-docker2)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    restart: unless-stopped

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: optiflow-backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./backend:/app
      - backend_mlflow:/app/mlruns
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "8000:8000"
    environment:
      # GPU Support - DISABLED
      # NVIDIA_VISIBLE_DEVICES: all
      # NVIDIA_DRIVER_CAPABILITIES: compute,utility
      # LD_LIBRARY_PATH: /usr/local/nvidia/lib:/usr/local/nvidia/lib64

      # Application
      APP_NAME: "OptiFlow AI Platform"
      ENVIRONMENT: development
      DEBUG: "true"
      SECRET_KEY: dev-secret-key-change-in-production

      # Database - PostgreSQL
      DATABASE_URL: postgresql+asyncpg://optiflow:optiflow_password@postgres:5432/optiflow

      # Database - InfluxDB
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: my-super-secret-influxdb-token
      INFLUXDB_ORG: optiflow
      INFLUXDB_BUCKET: timeseries

      # Database - Redis
      REDIS_URL: redis://:optiflow_redis_password@redis:6379/0

      # Message Queue
      RABBITMQ_URL: amqp://optiflow:optiflow_password@rabbitmq:5672/
      CELERY_BROKER_URL: amqp://optiflow:optiflow_password@rabbitmq:5672/
      CELERY_RESULT_BACKEND: redis://:optiflow_redis_password@redis:6379/4

      # Security
      JWT_SECRET_KEY: jwt-secret-key-change-in-production
      ACCESS_TOKEN_EXPIRE_MINUTES: 15

      # CORS
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:3000","http://localhost:3002"]'

      # OpenAI API (configure in .env file)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4-turbo-preview}
      OPENAI_MAX_TOKENS: ${OPENAI_MAX_TOKENS:-1500}
      OPENAI_TEMPERATURE: ${OPENAI_TEMPERATURE:-0.7}

      # Gateway
      GATEWAY_API_KEY: secure-gateway-api-key-change-in-production

      # AI Agent - Ollama
      OLLAMA_BASE_URL: http://ollama:11434
    
    # Allow access to host machine
    extra_hosts:
      - "host.docker.internal:host-gateway"
    
    # GPU Support (RTX 4060) - DISABLED
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

    networks:
      - optiflow-network
    depends_on:
      postgres:
        condition: service_healthy
      influxdb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Celery Worker
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: optiflow-celery-worker
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=4
    volumes:
      - ./backend:/app
      - backend_mlflow:/app/mlruns
    environment:
      # Database - PostgreSQL
      DATABASE_URL: postgresql+asyncpg://optiflow:optiflow_password@postgres:5432/optiflow

      # Database - InfluxDB
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: my-super-secret-influxdb-token
      INFLUXDB_ORG: optiflow
      INFLUXDB_BUCKET: timeseries

      # Database - Redis
      REDIS_URL: redis://:optiflow_redis_password@redis:6379/0

      # Message Queue
      RABBITMQ_URL: amqp://optiflow:optiflow_password@rabbitmq:5672/
      CELERY_BROKER_URL: amqp://optiflow:optiflow_password@rabbitmq:5672/
      CELERY_RESULT_BACKEND: redis://:optiflow_redis_password@redis:6379/4
    networks:
      - optiflow-network
    depends_on:
      - postgres
      - redis
      - rabbitmq
      - backend

  # Celery Beat (Scheduler)
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: optiflow-celery-beat
    command: celery -A app.tasks.celery_app beat --loglevel=info
    volumes:
      - ./backend:/app
    environment:
      RABBITMQ_URL: amqp://optiflow:optiflow_password@rabbitmq:5672/
      CELERY_BROKER_URL: amqp://optiflow:optiflow_password@rabbitmq:5672/
      CELERY_RESULT_BACKEND: redis://:optiflow_redis_password@redis:6379/4
    networks:
      - optiflow-network
    depends_on:
      - rabbitmq
      - redis
      - backend

  # Gateway (Data Collection)
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: optiflow-gateway
    command: python -m app
    volumes:
      - ./gateway:/app
      - ./gateway/config:/app/config
      - gateway_data:/app/data
    environment:
      API_URL: http://backend:8000
      API_KEY: secure-gateway-api-key-change-in-production
      LOG_LEVEL: INFO
    networks:
      - optiflow-network
    depends_on:
      - backend

  # OPC UA Simulator Server
  opcua-server:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: optiflow-opcua-server
    command: python scripts/run_opcua_server.py --endpoint opc.tcp://0.0.0.0:4840/optiflow/terminal
    working_dir: /app
    volumes:
      - ./backend:/app
    ports:
      - "4840:4840"
    environment:
      PYTHONUNBUFFERED: 1
      LOG_LEVEL: INFO
    networks:
      - optiflow-network
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import socket; s = socket.socket(); s.connect((\"localhost\", 4840)); s.close()'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Frontend Web Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: builder
    container_name: optiflow-frontend
    command: npm run dev -- --host --port 3000
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_WS_URL: ws://localhost:8000
    networks:
      - optiflow-network
    depends_on:
      - backend

  # MLflow (Model Tracking & Registry)
  mlflow:
    image: python:3.11-slim
    container_name: optiflow-mlflow
    command: >
      sh -c "pip install -q mlflow psycopg2-binary &&
             mlflow server
             --backend-store-uri postgresql://optiflow:optiflow_password@postgres:5432/optiflow
             --default-artifact-root /mlflow/artifacts
             --host 0.0.0.0
             --port 5000"
    volumes:
      - backend_mlflow:/mlflow
    ports:
      - "5000:5000"
    networks:
      - optiflow-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:5000/health\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ========================================
  # Monitoring Exporters
  # ========================================

  # PostgreSQL Exporter
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: optiflow-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://optiflow:optiflow_password@postgres:5432/optiflow?sslmode=disable"
    ports:
      - "9187:9187"
    networks:
      - optiflow-network
    depends_on:
      - postgres

  # Redis Exporter
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: optiflow-redis-exporter
    environment:
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: "optiflow_redis_password"
    ports:
      - "9121:9121"
    networks:
      - optiflow-network
    depends_on:
      - redis

  # Node Exporter (Host Metrics)
  node-exporter:
    image: prom/node-exporter:latest
    container_name: optiflow-node-exporter
    command:
      - '--path.rootfs=/host'
    pid: host
    restart: unless-stopped
    volumes:
      - /:/host:ro,rslave
    ports:
      - "9100:9100"
    networks:
      - optiflow-network

  # cAdvisor (Container Metrics)
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: optiflow-cadvisor
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8081:8080"
    networks:
      - optiflow-network
    restart: unless-stopped

  # ========================================
  # Prometheus (Metrics Collection)
  # ========================================

  prometheus:
    image: prom/prometheus:latest
    container_name: optiflow-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/prometheus/alerts:/etc/prometheus/alerts
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - optiflow-network
    depends_on:
      - postgres-exporter
      - redis-exporter
      - node-exporter
      - cadvisor

  # Grafana (Dashboards)
  grafana:
    image: grafana/grafana:latest
    container_name: optiflow-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: grafana-clock-panel
    volumes:
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    networks:
      - optiflow-network

networks:
  optiflow-network:
    driver: bridge

volumes:
  postgres_data:
  influxdb_data:
  influxdb_config:
  redis_data:
  rabbitmq_data:
  backend_mlflow:
  gateway_data:
  prometheus_data:
  grafana_data:
  ollama_data:
  zookeeper_data:
  zookeeper_logs:
  kafka_data:

# Log rotation global para todos os containers
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: optiflow-postgres
    environment:
      POSTGRES_DB: optiflow
      POSTGRES_USER: optiflow
      POSTGRES_PASSWORD: optiflow_password
      POSTGRES_INITDB_ARGS: "-E UTF8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - it-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U optiflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # InfluxDB Time Series Database
  influxdb:
    image: influxdb:2.7-alpine
    container_name: optiflow-influxdb
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: adminpassword
      DOCKER_INFLUXDB_INIT_ORG: optiflow
      DOCKER_INFLUXDB_INIT_BUCKET: timeseries
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: my-super-secret-influxdb-token
      DOCKER_INFLUXDB_INIT_RETENTION_PERIOD: 7d # PDCA: Adicionado limite de retenção de 7 dias
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    ports:
      - "8086:8086"
    networks:
      - it-network
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache & Pub/Sub
  redis:
    image: redis:7-alpine
    container_name: optiflow-redis
    command: redis-server --appendonly yes --requirepass optiflow_redis_password
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - it-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # RabbitMQ Message Broker (with MQTT plugin)
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: optiflow-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: optiflow
      RABBITMQ_DEFAULT_PASS: optiflow_password
      RABBITMQ_DEFAULT_VHOST: /
      RABBITMQ_PLUGINS: rabbitmq_management rabbitmq_mqtt
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
      - "1883:1883"   # MQTT port for Node-RED and IoT devices
    networks:
      - it-network
    command: >
      bash -c "rabbitmq-plugins enable --offline rabbitmq_mqtt &&
               rabbitmq-server"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Zookeeper - Kafka Coordination Service
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: optiflow-zookeeper
    logging: *default-logging
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SYNC_LIMIT: 2
    ports:
      - "2181:2181"
    networks:
      - it-network
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafka Broker 1 - Real-time Streaming Platform (PDCA #15: Multi-Broker Cluster)
  kafka-1:
    image: confluentinc/cp-kafka:7.5.0
    container_name: optiflow-kafka-1
    logging: *default-logging
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 8 # PDCA: Reduzido para 8h para economizar disco
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_COMPRESSION_TYPE: lz4
      KAFKA_NUM_PARTITIONS: 12 # PDCA: Aumentado para maior paralelismo
    volumes:
      - kafka_1_data:/var/lib/kafka/data
    networks:
      - it-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # Kafka Broker 2 (PDCA #15)
  kafka-2:
    image: confluentinc/cp-kafka:7.5.0
    container_name: optiflow-kafka-2
    logging: *default-logging
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9093:9093"
      - "9095:9095"
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9093,EXTERNAL://localhost:9095
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 8 # PDCA: Reduzido para 8h para economizar disco
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_COMPRESSION_TYPE: lz4
      KAFKA_NUM_PARTITIONS: 12 # PDCA: Aumentado para maior paralelismo
    volumes:
      - kafka_2_data:/var/lib/kafka/data
    networks:
      - it-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9093"]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # Kafka Broker 3 (PDCA #15)
  kafka-3:
    image: confluentinc/cp-kafka:7.5.0
    container_name: optiflow-kafka-3
    logging: *default-logging
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9096:9096"
      - "9097:9097"
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9096,EXTERNAL://localhost:9097
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 8 # PDCA: Reduzido para 8h para economizar disco
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_COMPRESSION_TYPE: lz4
      KAFKA_NUM_PARTITIONS: 12 # PDCA: Aumentado para maior paralelismo
    volumes:
      - kafka_3_data:/var/lib/kafka/data
    networks:
      - it-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9096"]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # Kafka UI - Web Interface for Kafka Management (PDCA #15: Multi-Broker Support)
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: optiflow-kafka-ui
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: optiflow-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:9092,kafka-2:9093,kafka-3:9096
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
      DYNAMIC_CONFIG_ENABLED: 'true'
    networks:
      - it-network
    restart: unless-stopped

  # Ollama - Local LLM for AI Assistant
  # Configured for RTX 4060 (8GB VRAM) with Qwen2.5:7B model
  # Port 11435 used to avoid conflict with host Ollama (if running on 11434)
  ollama:
    image: ollama/ollama:latest
    container_name: optiflow-ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11435:11434"  # Container Ollama on 11435, host Ollama can use 11434
    networks:
      - it-network
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_NUM_PARALLEL=2
      - OLLAMA_MAX_LOADED_MODELS=1
    # GPU support enabled for RTX 4060 (requires nvidia-docker2)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  # ========================================
  # HashiCorp Vault (Secrets Management)
  # ========================================
  vault:
    image: hashicorp/vault:latest
    container_name: optiflow-vault
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: optiflow-dev-root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "8200:8200"
    networks:
      - it-network
    healthcheck:
      test: ["CMD-SHELL", "wget --spider http://127.0.0.1:8200/v1/sys/health 2>&1 | grep -q 'remote file exists'"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ========================================
  # OPC UA Simulator (Grain Terminal)
  # ========================================
  opcua-server:
    build:
      context: ./opcua-simulator
      dockerfile: Dockerfile
    container_name: optiflow-opcua-server
    ports:
      - "4840:4840"
    networks:
      - ot-network  # PDCA #1: Apenas OT (PLCs)
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; s=socket.socket(); s.settimeout(2); s.connect(('localhost', 4840)); s.close()\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ========================================
  # Modbus TCP Simulator (Pump Station)
  # ========================================
  modbus-simulator:
    build:
      context: ./simulator
      dockerfile: Dockerfile.modbus
    container_name: optiflow-modbus-simulator
    ports:
      - "502:502"
    networks:
      - ot-network
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; s=socket.socket(); s.settimeout(2); s.connect(('localhost', 502)); s.close()\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: optiflow-backend
    logging: *default-logging
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./backend:/app
      - backend_mlflow:/app/mlruns
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "8000:8000"
    # SCALABILITY: Resource limits to prevent OOM with 1000 tags @ 1Hz
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
        reservations:
          cpus: '2.0'
          memory: 2G
    environment:
      # GPU Support - DISABLED
      # NVIDIA_VISIBLE_DEVICES: all
      # NVIDIA_DRIVER_CAPABILITIES: compute,utility
      # LD_LIBRARY_PATH: /usr/local/nvidia/lib:/usr/local/nvidia/lib64

      # Vault Configuration
      VAULT_ENABLED: "true"
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: optiflow-dev-root-token

      # Application
      APP_NAME: "OptiFlow AI Platform"
      ENVIRONMENT: development
      DEBUG: "true"
      SECRET_KEY: dev-secret-key-change-in-production

      # Database - PostgreSQL
      DATABASE_URL: postgresql+asyncpg://optiflow:optiflow_password@postgres:5432/optiflow

      # Database - InfluxDB
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: my-super-secret-influxdb-token
      INFLUXDB_ORG: optiflow
      INFLUXDB_BUCKET: timeseries

      # Database - Redis
      REDIS_URL: redis://:optiflow_redis_password@redis:6379/0

      # Message Queue
      RABBITMQ_URL: amqp://optiflow:optiflow_password@rabbitmq:5672/
      CELERY_BROKER_URL: amqp://optiflow:optiflow_password@rabbitmq:5672/
      CELERY_RESULT_BACKEND: redis://:optiflow_redis_password@redis:6379/4

      # Security
      JWT_SECRET_KEY: jwt-secret-key-change-in-production
      ACCESS_TOKEN_EXPIRE_MINUTES: 15

      # CORS
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:3000","http://localhost:3002"]'

      # OpenAI API (configure in .env file)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4-turbo-preview}
      OPENAI_MAX_TOKENS: ${OPENAI_MAX_TOKENS:-1500}
      OPENAI_TEMPERATURE: ${OPENAI_TEMPERATURE:-0.7}

      # Gateway
      GATEWAY_API_KEY: secure-gateway-api-key-change-in-production
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9093,kafka-3:9096

      # AI Agent - Ollama
      OLLAMA_BASE_URL: http://ollama:11434
    
    # Allow access to host machine
    extra_hosts:
      - "host.docker.internal:host-gateway"
    
    # GPU Support (RTX 4060) - DISABLED
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

    networks:
      - it-network  # PDCA #1: Backend apenas em IT network (isolado de OT)
    depends_on:
      vault:
        condition: service_healthy
      postgres:
        condition: service_healthy
      influxdb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy

  # Celery Worker (Background Tasks - PDCA #11 Enhanced)
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: optiflow-celery-worker
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=8 --max-tasks-per-child=100
    volumes:
      - ./backend:/app
      - backend_mlflow:/app/mlruns
    environment:
      # Vault Configuration
      VAULT_ENABLED: "true"
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: optiflow-dev-root-token

      # Database - PostgreSQL (fallback)
      DATABASE_URL: postgresql+asyncpg://optiflow:optiflow_password@postgres:5432/optiflow

      # Database - InfluxDB (fallback)
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: my-super-secret-influxdb-token
      INFLUXDB_ORG: optiflow
      INFLUXDB_BUCKET: timeseries

      # Database - Redis (fallback)
      REDIS_URL: redis://:optiflow_redis_password@redis:6379/0

      # Message Queue (fallback)
      RABBITMQ_URL: amqp://optiflow:optiflow_password@rabbitmq:5672/
      CELERY_BROKER_URL: amqp://optiflow:optiflow_password@rabbitmq:5672/
      CELERY_RESULT_BACKEND: redis://:optiflow_redis_password@redis:6379/4

      # MLflow (for ML retraining)
      MLFLOW_TRACKING_URI: http://mlflow:5000
    # SCALABILITY: Adicionado limites de recursos para workers
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
        reservations:
          cpus: '2.0'
          memory: 2G
    networks:
      - it-network
    depends_on:
      vault:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      influxdb:
        condition: service_healthy
      mlflow:
        condition: service_started
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # Celery Beat (Scheduler)
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: optiflow-celery-beat
    command: celery -A app.tasks.celery_app beat --loglevel=info
    volumes:
      - ./backend:/app
    environment:
      # Vault Configuration
      VAULT_ENABLED: "true"
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: optiflow-dev-root-token

      # Fallback configuration
      RABBITMQ_URL: amqp://optiflow:optiflow_password@rabbitmq:5672/
      CELERY_BROKER_URL: amqp://optiflow:optiflow_password@rabbitmq:5672/
      CELERY_RESULT_BACKEND: redis://:optiflow_redis_password@redis:6379/4
    networks:
      - it-network
    depends_on:
      - rabbitmq
      - redis
      - backend

  # Gateway (Data Collection)
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: optiflow-gateway
    logging: *default-logging
    command: python -m app.main_with_api
    ports:
      - "8080:8080"  # Gateway Configuration API
    volumes:
      - ./gateway:/app
      - ./gateway/config:/app/config
      - gateway_data:/app/data
    # SCALABILITY: Resource limits for high-volume data collection
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '1.0'
          memory: 768M
    environment:
      API_URL: http://backend:8000
      API_KEY: secure-gateway-api-key-change-in-production
      LOG_LEVEL: INFO
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9093,kafka-3:9096
      # Security Configuration
      GATEWAY_API_KEY_ENABLED: "true"
      GATEWAY_API_KEY: "gw-secure-key-2025-production"
      GATEWAY_JWT_ENABLED: "true"
      GATEWAY_JWT_SECRET: "super-secret-jwt-key-for-gateway-edge-2025"
      GATEWAY_READ_ONLY_MODE: "false"
      GATEWAY_RATE_LIMIT_ENABLED: "true"
      GATEWAY_RATE_LIMIT_REQUESTS: "100"
      GATEWAY_RATE_LIMIT_WINDOW: "60"
    networks:
      # PDCA #1: Gateway tem acesso a AMBAS as redes (funciona como diodo de dados)
      - ot-network   # Comunica com PLCs (OPC UA, Modbus, etc)
      - it-network   # Envia dados para Backend
    depends_on:
      backend:
        condition: service_started
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy

  # Frontend Web Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # Removed target: builder to use production nginx stage
    container_name: optiflow-frontend
    # Removed dev command - will use CMD from Dockerfile (nginx)
    # Removed volumes - production build doesn't need source mount
    ports:
      - "3000:80"  # Map host 3000 to container 80 (nginx)
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_WS_URL: ws://localhost:8000
    networks:
      - it-network
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 -O /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # MLflow (Model Tracking & Registry)
  mlflow:
    image: python:3.11-slim
    container_name: optiflow-mlflow
    command: >
      sh -c "pip install -q mlflow psycopg2-binary &&
             mlflow server
             --backend-store-uri postgresql://optiflow:optiflow_password@postgres:5432/optiflow
             --default-artifact-root /mlflow/artifacts
             --host 0.0.0.0
             --port 5000"
    volumes:
      - backend_mlflow:/mlflow
    ports:
      - "5000:5000"
    networks:
      - it-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:5000/health\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ========================================
  # Monitoring Exporters
  # ========================================

  # PostgreSQL Exporter
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: optiflow-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://optiflow:optiflow_password@postgres:5432/optiflow?sslmode=disable"
    ports:
      - "9187:9187"
    networks:
      - it-network
    depends_on:
      - postgres

  # Redis Exporter
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: optiflow-redis-exporter
    environment:
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: "optiflow_redis_password"
    ports:
      - "9121:9121"
    networks:
      - it-network
    depends_on:
      - redis

  # Node Exporter (Host Metrics)
  node-exporter:
    image: prom/node-exporter:latest
    container_name: optiflow-node-exporter
    command:
      - '--path.rootfs=/host'
    pid: host
    restart: unless-stopped
    volumes:
      - /:/host:ro,rslave
    ports:
      - "9100:9100"
    networks:
      - it-network

  # cAdvisor (Container Metrics)
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: optiflow-cadvisor
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8081:8080"
    networks:
      - it-network
    restart: unless-stopped

  # ========================================
  # Prometheus (Metrics Collection)
  # ========================================

  prometheus:
    image: prom/prometheus:latest
    container_name: optiflow-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d' # PDCA: Adicionado limite de retenção de 7 dias
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/prometheus/alerts:/etc/prometheus/alerts
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - it-network
    depends_on:
      - postgres-exporter
      - redis-exporter
      - node-exporter
      - cadvisor

  # ========================================
  # Node-RED (Protocol Validation & Testing)
  # ========================================
  # Used for validating industrial protocol communication (READ-ONLY)
  # Pre-installed: Siemens S7, Rockwell EtherNet/IP, MQTT, OPC-UA, Modbus
  nodered:
    build:
      context: ./nodered
      dockerfile: Dockerfile
    container_name: optiflow-nodered
    environment:
      - TZ=America/Sao_Paulo
    ports:
      - "1880:1880"
      - "4841:4840"    # OPC-UA Server (Node-RED simulator) - Use 4841 to avoid conflict with opcua-server
      - "5020:502"     # Modbus TCP Server (Node-RED simulator) - Use 5020 to avoid conflict with modbus-simulator
    volumes:
      - nodered_data:/data
      - ./nodered/settings.js:/data/settings.js:ro
    networks:
      - ot-network   # Access to PLCs (Siemens, Rockwell, Modbus)
      - it-network   # Access to MQTT broker, Kafka, InfluxDB
    depends_on:
      - rabbitmq
      - influxdb
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 -O /dev/null http://127.0.0.1:1880/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Grafana (Dashboards)
  grafana:
    image: grafana/grafana:latest
    container_name: optiflow-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: grafana-clock-panel
    volumes:
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    networks:
      - it-network

networks:
  # PDCA #1: Segmentação de Rede OT/IT
  # OT Network: Gateway ↔ PLCs (isolada, sem acesso externo)
  ot-network:
    driver: bridge
    internal: true  # Sem acesso à internet/rede externa

  # IT Network: Backend ↔ Frontend ↔ Databases
  it-network:
    driver: bridge

  # Legacy network (manter para compatibilidade temporária)
  optiflow-network:
    driver: bridge

volumes:
  postgres_data:
  influxdb_data:
  influxdb_config:
  redis_data:
  rabbitmq_data:
  backend_mlflow:
  gateway_data:
  prometheus_data:
  grafana_data:
  ollama_data:
  zookeeper_data:
  zookeeper_logs:
  kafka_1_data:  # PDCA #15: Multi-broker volumes
  kafka_2_data:
  kafka_3_data:
  nodered_data:  # Node-RED flows and configurations
